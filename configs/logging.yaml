logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  
  handlers:
    console:
      enabled: true
      level: INFO
    
    file:
      enabled: true
      level: DEBUG
      path: logs/
      max_bytes: 10485760
      backup_count: 5
      encoding: utf-8
    
    json:
      enabled: false
      path: logs/json/

  loggers:
    src:
      level: DEBUG
    kafka:
      level: WARNING
    pyspark:
      level: WARNING
    urllib3:
      level: WARNING
    uvicorn:
      level: INFO
    sqlalchemy:
      level: WARNING

  disable_existing_loggers: false
