models:
  physical:
    isolation_forest:
      n_estimators: 100
      contamination: 0.1
      max_samples: auto
      max_features: 1.0
      random_state: 42
      n_jobs: -1
      save_path: models/physical/isolation_forest

    autoencoder:
      encoding_dim: 16
      hidden_dims: [64, 32]
      activation: relu
      epochs: 100
      batch_size: 64
      learning_rate: 0.001
      early_stopping_patience: 10
      validation_split: 0.15
      threshold_percentile: 95
      save_path: models/physical/autoencoder

  cyber:
    random_forest:
      n_estimators: 300
      max_depth: 12
      min_samples_split: 5
      min_samples_leaf: 2
      class_weight: balanced
      random_state: 42
      n_jobs: -1
      save_path: models/cyber/random_forest

    xgboost:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 3
      gamma: 0.1
      reg_alpha: 0.1
      reg_lambda: 1.0
      objective: multi:softprob
      eval_metric: mlogloss
      use_label_encoder: false
      random_state: 42
      n_jobs: -1
      tree_method: hist
      save_path: models/cyber/xgboost

  versioning:
    current_version: v1
    auto_increment: true
