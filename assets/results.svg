<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Model accuracy: IF Ensemble 99.67, Autoencoder 95.35, Random Forest 99.40, XGBoost 99.62, Stacking 97.52 percent">
<style>.l{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:14px;font-weight:700;fill:#e6edf3}.s{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:11.5px;fill:#8b949e}.v{font-family:Consolas,Menlo,monospace;font-size:15px;font-weight:700}</style>
<rect width="900" height="360" rx="14" fill="#0d1117" stroke="#30363d"/>
<text x="450" y="28" text-anchor="middle" style="font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;fill:#e6edf3">Real training results: accuracy</text><text x="24" y="62" class="l">IF Ensemble (9 IF + XGB meta)</text><text x="24" y="78" class="s">Physical  |  F1 0.983  AUC 0.9996</text>
<rect x="330" y="48" width="470" height="20" rx="10" fill="#21262d"/>
<rect x="330" y="48" width="468.4" height="20" rx="10" fill="#22d3ee"><animate attributeName="width" values="0;468.4;468.4" keyTimes="0;0.35;1" dur="8s" begin="0.0s" repeatCount="indefinite"/></rect>
<text x="876" y="63" text-anchor="end" class="v" fill="#22d3ee">99.67%</text><text x="24" y="114" class="l">Autoencoder (normal-only)</text><text x="24" y="130" class="s">Physical  |  F1 0.704  AUC 0.849</text>
<rect x="330" y="100" width="470" height="20" rx="10" fill="#21262d"/>
<rect x="330" y="100" width="448.1" height="20" rx="10" fill="#22d3ee"><animate attributeName="width" values="0;448.1;448.1" keyTimes="0;0.35;1" dur="8s" begin="0.3s" repeatCount="indefinite"/></rect>
<text x="876" y="115" text-anchor="end" class="v" fill="#22d3ee">95.35%</text><text x="24" y="166" class="l">Random Forest</text><text x="24" y="182" class="s">Cyber  |  F1 0.997  AUC 0.9994</text>
<rect x="330" y="152" width="470" height="20" rx="10" fill="#21262d"/>
<rect x="330" y="152" width="467.2" height="20" rx="10" fill="#f43f5e"><animate attributeName="width" values="0;467.2;467.2" keyTimes="0;0.35;1" dur="8s" begin="0.6s" repeatCount="indefinite"/></rect>
<text x="876" y="167" text-anchor="end" class="v" fill="#f43f5e">99.40%</text><text x="24" y="218" class="l">XGBoost</text><text x="24" y="234" class="s">Cyber  |  F1 0.998  AUC 0.9994</text>
<rect x="330" y="204" width="470" height="20" rx="10" fill="#21262d"/>
<rect x="330" y="204" width="468.2" height="20" rx="10" fill="#f43f5e"><animate attributeName="width" values="0;468.2;468.2" keyTimes="0;0.35;1" dur="8s" begin="0.8999999999999999s" repeatCount="indefinite"/></rect>
<text x="876" y="219" text-anchor="end" class="v" fill="#f43f5e">99.62%</text><text x="24" y="270" class="l">Stacking Ensemble (unified)</text><text x="24" y="286" class="s">All  |  F1 0.977  AUC 0.9895</text>
<rect x="330" y="256" width="470" height="20" rx="10" fill="#21262d"/>
<rect x="330" y="256" width="458.3" height="20" rx="10" fill="#a78bfa"><animate attributeName="width" values="0;458.3;458.3" keyTimes="0;0.35;1" dur="8s" begin="1.2s" repeatCount="indefinite"/></rect>
<text x="876" y="271" text-anchor="end" class="v" fill="#a78bfa">97.52%</text>
<text x="450" y="336" text-anchor="middle" style="font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:12px;fill:#d29922">Training-time results. Runtime plain-IF replay accuracy is about 69% (see Known Limitations).</text></svg>