<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Quick start in a terminal: clone, docker compose up, restart services, open the dashboard">
<style>.p,.o{font-family:Consolas,Menlo,monospace;font-size:16px}.g{fill:#4ade80}.c{fill:#fde68a}.o{fill:#67e8f9}</style>
<rect width="900" height="330" rx="14" fill="#0d1117" stroke="#30363d"/><rect width="900" height="38" rx="14" fill="#161b22"/><rect y="24" width="900" height="14" fill="#161b22"/>
<circle cx="24" cy="19" r="6" fill="#ff5f56"/><circle cx="46" cy="19" r="6" fill="#ffbd2e"/><circle cx="68" cy="19" r="6" fill="#27c93f"/>
<text x="450" y="24" text-anchor="middle" style="font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:13px;fill:#8b949e">quick start</text><clipPath id="q0"><rect x="28" y="64" width="0" height="28"><animate attributeName="width" dur="20.0s" repeatCount="indefinite" keyTimes="0;0.0300;0.1250;0.97;1" values="0;0;693;693;0"/></rect></clipPath>
<text x="28" y="84" class="p" clip-path="url(#q0)"><tspan class="g">$ </tspan><tspan class="c">git clone https://github.com/JDevender007/Real-Time-Anomaly-...git</tspan></text>
<text x="28" y="108" class="o" opacity="0">&#10003; cloned<animate attributeName="opacity" dur="20.0s" repeatCount="indefinite" keyTimes="0;0.1350;0.1600;0.97;1" values="0;0;1;1;0"/></text><clipPath id="q1"><rect x="28" y="122" width="0" height="28"><animate attributeName="width" dur="20.0s" repeatCount="indefinite" keyTimes="0;0.2600;0.3550;0.97;1" values="0;0;238;238;0"/></rect></clipPath>
<text x="28" y="142" class="p" clip-path="url(#q1)"><tspan class="g">$ </tspan><tspan class="c">docker compose up -d</tspan></text>
<text x="28" y="166" class="o" opacity="0">&#10003; 10 services starting<animate attributeName="opacity" dur="20.0s" repeatCount="indefinite" keyTimes="0;0.3650;0.3900;0.97;1" values="0;0;1;1;0"/></text><clipPath id="q2"><rect x="28" y="180" width="0" height="28"><animate attributeName="width" dur="20.0s" repeatCount="indefinite" keyTimes="0;0.4900;0.5850;0.97;1" values="0;0;644;644;0"/></rect></clipPath>
<text x="28" y="200" class="p" clip-path="url(#q2)"><tspan class="g">$ </tspan><tspan class="c">docker compose restart simulator streaming replayer spark-job</tspan></text>
<text x="28" y="224" class="o" opacity="0">&#10003; once Kafka is healthy<animate attributeName="opacity" dur="20.0s" repeatCount="indefinite" keyTimes="0;0.5950;0.6200;0.97;1" values="0;0;1;1;0"/></text><clipPath id="q3"><rect x="28" y="238" width="0" height="28"><animate attributeName="width" dur="20.0s" repeatCount="indefinite" keyTimes="0;0.7200;0.8150;0.97;1" values="0;0;396;396;0"/></rect></clipPath>
<text x="28" y="258" class="p" clip-path="url(#q3)"><tspan class="g">$ </tspan><tspan class="c">open http://localhost:8000/dashboard</tspan></text>
<text x="28" y="282" class="o" opacity="0">&#10003; live dashboard ready<animate attributeName="opacity" dur="20.0s" repeatCount="indefinite" keyTimes="0;0.8250;0.8500;0.97;1" values="0;0;1;1;0"/></text>
<rect x="28" y="304" width="10" height="4" fill="#4ade80"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect></svg>